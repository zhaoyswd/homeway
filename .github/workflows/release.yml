name: release

# 发版 = 推 tag：`git tag v0.x.y && git push origin v0.x.y`
# 纯 Go 静态交叉编译（CGO_ENABLED=0），单 ubuntu runner 出全部平台产物；linux/amd64 上冒烟后再发 Release。
# 手动试跑：Actions 页点 "Run workflow"（只跑构建+冒烟，不发 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm,   goarm: '7' }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF##*/}"          # tag 名；手动试跑时是分支名
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # windows 的 -o 不会自动补 .exe，显式带上（否则打包时找不到文件）
          EXT=""
          [ "${GOOS}" = "windows" ] && EXT=".exe"
          # 单二进制（exit / relay 按子命令区分）。产物直接放包根：解出来就是可执行文件，
          # 用户不用先 cd 进子目录。
          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/homeway${EXT}" ./cmd/homeway
          cd dist
          ARCH="${GOARCH}${GOARM}"
          BASE="homeway_${VERSION#v}_${GOOS}_${ARCH}"
          if [ "${GOOS}" = "windows" ]; then
            zip -q "${BASE}.zip" "homeway${EXT}"
            sha256sum "${BASE}.zip" > "${BASE}.zip.sha256"
          else
            tar czf "${BASE}.tar.gz" homeway
            sha256sum "${BASE}.tar.gz" > "${BASE}.tar.gz.sha256"
          fi
          ls -l
      - uses: actions/upload-artifact@v4
        if: matrix.goos != 'windows'
        with:
          name: homeway-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: homeway-windows-zip
          path: dist/*.zip*

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homeway-linux-amd64
      - name: 冒烟（产物真能跑）
        run: |
          set -euo pipefail
          tar xzf homeway_*_linux_amd64.tar.gz
          ./homeway --version | grep -q '^homeway '
          ./homeway relay --version | grep -q '^homeway '
          ./homeway --help >/dev/null 2>&1 || true
          ./homeway exit --help >/dev/null 2>&1 || true
          ./homeway relay --help >/dev/null 2>&1 || true

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
