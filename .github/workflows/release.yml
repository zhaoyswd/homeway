name: release

# 发版 = 推 tag：`git tag v0.x.y && git push origin v0.x.y`
# 构建配方（openspec term-vt-backend D7）：终端的服务端 vt 依赖 vendored libghostty-vt（C 库），
# 带 vt 的目标必须 CGO_ENABLED=1——
#   - darwin×2：macos runner，Apple clang 原生（amd64 用 -arch 交叉）。不用 zig cc 交叉 darwin：
#     zig 的 macOS libc 桩没有 libresolv，Go 的 net 包链接必炸（2026-09-27 实测）。产物自带
#     ad-hoc 签名（CI 内 codesign 核验）；真机冒烟在发版后于主力 Mac 手动 gate（Mac 是主力出口）。
#   - linux×2：ubuntu runner，zig cc musl 静态交叉（spike 已在阿里云真机验证；smoke 核验
#     statically linked）。
#   - armv7 / windows：无 vt 纯 Go 变体（CGO_ENABLED=0，构建标签隔离见 pkg/term/term_vt_off.go）；
#     armv7 等 zig 0.16.0 std 的 lseek 位宽 bug 修复后回归 cgo（design D7）。
# vt 静态库不入库（prebuilt/ gitignore）：构建/测试前先跑 tools/build-vt.sh（钉 zig 0.16.0）。
# 手动试跑：Actions 页点 "Run workflow"（只跑构建+冒烟，不发 Release）。
# 注意：push main **不触发**本 workflow（触发只有 v* tag 与 workflow_dispatch）——迁移/守卫类
# 改动（CI 自身、clientcore、surface）后先用 workflow_dispatch 手动把两条腿跑绿再发版（exec-r4 中-3）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 发版纪律门（FIX-100）：tag 必须打在 main 头上——「main == tag 无门（已破一次）」
      # 的收口。tag 推送时若指向落后/超前 origin/main 的提交，产物与 main 不符且事后
      # 难对齐；这里在全部构建之前拦下（先合 main 并推 main，再打 tag）。
      # 非 tag 触发（workflow_dispatch）跳过本步。
      - name: 发版纪律门：tag == origin/main 头
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          main="$(git rev-parse origin/main)"
          head="$(git rev-parse HEAD)"
          if [ "$main" != "$head" ]; then
            echo "error: tag $GITHUB_REF_NAME 指向 $head，而 origin/main 当前为 $main" >&2
            echo "发版纪律：tag 必须打在 main 头上——先把要发的提交合入并推 main，再打 tag" >&2
            exit 1
          fi
          echo "ok: tag 指向 origin/main 头（$head）"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go directive 守卫（core-homeway-merge 2.4）：手机核（clientcore）被 OHOS Go 1.24.5 钉死
      # （私有构建机 GOTOOLCHAIN=local，go1.24.5 拒绝一切高于自身补丁版的 directive），而公开 CI
      # 若放行，任何上调都会「公开 CI 全绿、只在私有构建机炸」。需要更高 Go 时走 clientcore 嵌套
      # 子模块预案（openspec core-homeway-merge design D2），不是直接上调本仓 directive。
      # 判据为**补丁级**（exec-r4 中-1）：OHOS 构建机 go1.24.5 而非任意 1.24.x——directive 1.24.6+
      # 同样必须红（go1.24.5 会报 requires go >= 1.24.6 拒绝构建）。
      - name: go directive 守卫（>1.24.5 即红）
        run: |
          set -euo pipefail
          directive="$(awk '$1=="go"{print $2; exit}' go.mod)"
          case "$directive" in
            1.24|1.24.0|1.24.[1-5]) echo "ok: go directive = ${directive}（≤1.24.5，OHOS 构建机 go1.24.5 绑定满足）" ;;
            *) echo "error: go.mod go directive = ${directive} > 1.24.5——OHOS 构建机工具链是 go1.24.5（不是任意 1.24.x），clientcore 被硬钉（见上方注释），请走嵌套子模块预案而非上调" >&2; exit 1 ;;
          esac
      # go test 会链接 pkg/term/vt（cgo）⇒ 先产本目标的 libghostty-vt 静态库
      - name: Install zig 0.16.0（tools/build-vt.sh 钉的版本；装到 ~/zig-0.16.0 供其发现）
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/^arm64$/aarch64/')"
          os="$(uname -s | sed 's/^Darwin$/macos/;s/^Linux$/linux/')"
          url="$(curl -fsSL https://ziglang.org/download/index.json | jq -r --arg k "${arch}-${os}" '."0.16.0"[$k].tarball')"
          echo "zig tarball: ${url}"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-0.16.0"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-0.16.0" --strip-components=1
          "$HOME/zig-0.16.0/zig" version | grep -qx '0.16.0'
      - run: bash tools/build-vt.sh linux-amd64
      # 无 tag 面（出口侧）五门：排除面只收 clientcore/cmd/clientcore（host-registry-daemon
      # 1.6/N1 收窄，clientcore-distribution「构建面与可编性门禁」MODIFIED）——共享核包
      # （clientcore/hostsession、internal/wgcore、internal/wtransport）无 tag 可编可测，
      # 测试进无 tag 面；cmd/clientcore 仍整包 cshared（无 tag 时 build constraints 全排除、
      # CGO_ENABLED=0 下加 tag 也救不了），由 clientcore job 的 cshared 面守。收窄后 windows
      # 桩门覆盖共享核包（flock/TUN fd 平台拆分，1.1）。
      - run: go vet $(go list ./... | grep -vE '/clientcore/cmd/clientcore$')
      # -p 1（包级串行）：并行包执行时各测试二进制的随机 TCP 监听会撞进彼此的端口号
      #（v0.12.1 已记同族；3f 发版窗口 dispatch 连三轮各撞不同包〔control 流限额时序 /
      # daemon files 终结归因 / relay UDP 端口号上重绑 TCP 撞号〕，套件增至 26 包后恶化）
      # ——串行后跨包端口竞争与 CPU 争用两个 flake 源同时消除，代价 = test 步墙钟翻倍
      #（分钟级）。本地复跑（整面 + 撞号用例 -count=8 加压）皆绿，判 runner 环境非代码。
      - run: go test -p 1 $(go list ./... | grep -vE '/clientcore/cmd/clientcore$')
      # off 变体（CGO_ENABLED=0 / armv7）与 windows 桩也必须一直可编：armv7/windows 的发版产物
      # 就编在这条路径上，别等 build job 才发现烂了（term_vt_off 断编 2026-09-27 的教训）。
      - run: CGO_ENABLED=0 go build $(go list ./... | grep -vE '/clientcore/cmd/clientcore$')
      - run: CGO_ENABLED=0 go vet $(go list ./... | grep -vE '/clientcore/cmd/clientcore$')
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build $(go list ./... | grep -vE '/clientcore/cmd/clientcore$')
      # surface 宿主测试（core-homeway-merge 2.2）：解码四件套 + golden fixture 的跨语言判据，
      # 纯标准库 + zlib，秒级；golden 样例已提交在同仓 surface/test/golden。
      - name: surface 宿主测试（surface 四件套 + golden fixture）
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev
          bash tools/surface-host-test.sh
      # 契约台账对账门（contract-ledger 6.1）：两组包（中-3）——
      #   ① contracts 包全量（词表对账规则①②④ + fixtures 摘要冻结门③ + 净室对拍；
      #      不点名 -run 防空绿——r3 N-19）；
      #   ② 版本治理生产侧（fixtures 版本目录遍历 + GREETING/surface 版本门 + 错配注入红路：
      #      必须import 生产解码器，落 internal/control 与 pkg/term 的生产侧测试——D5）。
      # 隐式 `go test -p 1 ./...` 仍兜底；显式 step 保门可见性，并与 8.3 判据③采证命令同形。
      - name: 契约台账对账门（contracts 对账 + 版本治理生产侧）
        run: |
          set -euo pipefail
          go test ./contracts/... -count=1 -v
          go test ./internal/control/ ./pkg/term/ -run 'TestVersionGovernance' -count=1 -v
      # 声明文件必须与当前依赖一致（改了依赖没重跑生成脚本 ⇒ 别发版）
      - run: bash tools/gen-third-party-notices.sh --check

  # clientcore 面（core-homeway-merge 2.4）：-tags cshared 构建测试；与无 tag 面互斥共存。
  # 不发 dylib 发行产物——桌面消费形态是统一进程直接 import 包（思路 B），darwin 的
  # c-shared 构建只是「//export 面可编可见」的冒烟。
  clientcore:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # wtransport 的集成测试引 pkg/term（→ term/vt 的 cgo）⇒ 该包测试二进制链接
      # libghostty-vt（exec-r4 后 CI 实跑暴露：cmd/clientcore 面不引 vt，缺库只在
      # go test 炸 `-lghostty-vt`）。与 test/build job 同法：先装 zig 0.16.0 再产
      # **本机目标**的静态库（目标 = $(go env GOOS)-$(go env GOARCH)：ubuntu 腿
      # linux-amd64、macos 腿 darwin-arm64——vt 一律 zig 产，build job 的 darwin 腿
      # 同款；Apple clang 只用于编 Go 二进制本体，与 vt 无关）。
      - name: Install zig 0.16.0（tools/build-vt.sh 钉的版本；装到 ~/zig-0.16.0 供其发现）
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/^arm64$/aarch64/')"
          os="$(uname -s | sed 's/^Darwin$/macos/;s/^Linux$/linux/')"
          url="$(curl -fsSL https://ziglang.org/download/index.json | jq -r --arg k "${arch}-${os}" '."0.16.0"[$k].tarball')"
          echo "zig tarball: ${url}"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-0.16.0"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-0.16.0" --strip-components=1
          "$HOME/zig-0.16.0/zig" version | grep -qx '0.16.0'
      - run: bash tools/build-vt.sh "$(go env GOOS)-$(go env GOARCH)"
      - run: go build -tags cshared ./clientcore/...
      - run: go vet -tags cshared ./clientcore/...
      # -p 1 同 test job：跨包端口竞争消除（wtransport 等集成测试也监听随机端口）。
      - run: go test -p 1 -tags cshared ./clientcore/...
      - name: c-shared 构建冒烟（//export 面完整可见；不发 dylib 产物）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          go build -buildmode=c-shared -tags cshared -o /tmp/libclientcore-smoke.so ./clientcore/cmd/clientcore
          want="$(grep -rh '^//export' clientcore/cmd/clientcore/*.go | sort -u | wc -l | tr -d ' ')"
          got="$(nm -g /tmp/libclientcore-smoke.so | grep -c ' T _ClientCore' || true)"
          echo "//export 面：源 ${want} 个 / nm T 符号 ${got} 个"
          [ "$want" -eq "$got" ]

  build:
    needs: [test, clientcore]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ 已知限制（exec-r1 中-1，登记不自级修复）：linux 产物因 vt 静态库 + cgo
          # 静态链接跨 runner 不可逐字节复现——同 commit 重跑会产出不同字节的 linux 二进制
          #（darwin 跨 run 一致）。「在役 = Release 产物」的核验以当次下载对 sidecar 为准。
          # ---- 带 vt 的 cgo 目标（D7）----
          - { os: macos-latest,  goos: darwin,  goarch: arm64, vt: cgo }
          - { os: macos-latest,  goos: darwin,  goarch: amd64, vt: cgo, cc: "clang -arch x86_64" }
          - { os: ubuntu-latest, goos: linux,   goarch: amd64, vt: cgo, zig: x86_64-linux-musl, static: "yes" }
          - { os: ubuntu-latest, goos: linux,   goarch: arm64, vt: cgo, zig: aarch64-linux-musl, static: "yes" }
          # ---- 无 vt 的纯 Go 变体（D7）----
          - { os: ubuntu-latest, goos: linux,   goarch: arm, goarm: "7", vt: none }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, vt: none }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zig 0.16.0
        if: matrix.vt == 'cgo'
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/^arm64$/aarch64/')"
          os="$(uname -s | sed 's/^Darwin$/macos/;s/^Linux$/linux/')"
          url="$(curl -fsSL https://ziglang.org/download/index.json | jq -r --arg k "${arch}-${os}" '."0.16.0"[$k].tarball')"
          echo "zig tarball: ${url}"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig-0.16.0"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-0.16.0" --strip-components=1
          "$HOME/zig-0.16.0/zig" version | grep -qx '0.16.0'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.vt == 'cgo' && '1' || '0' }}
          CC: ${{ matrix.zig != '' && format('zig cc -target {0}', matrix.zig) || matrix.cc }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF##*/}"          # tag 名；手动试跑时是分支名
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # linux 走 musl 静态：解压即跑，不挑发行版 libc（D7）
          if [ "${{ matrix.static }}" = "yes" ]; then
            LDFLAGS="${LDFLAGS} -extldflags -static"
          fi
          # 带 vt 的目标先产 libghostty-vt 静态库（prebuilt/ 不入库）；zig cc 需要 zig 在 PATH
          if [ "${{ matrix.vt }}" = "cgo" ]; then
            bash tools/build-vt.sh "${GOOS}-${GOARCH}"
            export PATH="$HOME/zig-0.16.0:$PATH"
          fi
          # windows 的 -o 不会自动补 .exe，显式带上（否则打包时找不到文件）
          EXT=""
          [ "${GOOS}" = "windows" ] && EXT=".exe"
          # 单二进制（serve / relay / term 等按子命令区分）。产物直接放包根：解出来就是可执行文件，
          # 用户不用先 cd 进子目录。
          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/homeway${EXT}" ./cmd/homeway
          # 构建口径核验：带 vt 的目标必须真带 CGO，纯 Go 目标必须不带（防静默回落）
          want=$([ "${{ matrix.vt }}" = "cgo" ] && echo 1 || echo 0)
          go version -m "dist/homeway${EXT}" | grep -q "CGO_ENABLED=${want}"
          # darwin ad-hoc 签名：只有**本机架构**的链接产物 ld 才自动签，-arch 交叉链出的
          # x86_64 是未签名（2026-09-27 CI 实测）；不签在 Apple Silicon/Rosetta 上直接被杀
          #（OS_REASON_CODESIGNING 前科）。必须在打包**前**签，归档里才是签好的。
          if [ "${GOOS}" = "darwin" ]; then
            codesign --force --sign - "dist/homeway"
          fi
          # 自有许可与第三方声明一起打进归档：BSD-3/MIT/Apache-2.0 都要求二进制分发时随附声明
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/
          cd dist
          ARCH="${GOARCH}${GOARM}"
          BASE="homeway_${VERSION#v}_${GOOS}_${ARCH}"
          if [ "${GOOS}" = "windows" ]; then
            zip -q "${BASE}.zip" "homeway${EXT}" LICENSE THIRD-PARTY-NOTICES.txt
            sha256sum "${BASE}.zip" > "${BASE}.zip.sha256"
          else
            tar czf "${BASE}.tar.gz" homeway LICENSE THIRD-PARTY-NOTICES.txt
            sha256sum "${BASE}.tar.gz" > "${BASE}.tar.gz.sha256"
          fi
          ls -l
      - name: darwin ad-hoc 签名核验（真机冒烟在发版后于主力 Mac 手动做）
        if: matrix.goos == 'darwin'
        run: codesign -dv dist/homeway 2>&1 | grep -q 'Signature=adhoc'
      - uses: actions/upload-artifact@v4
        if: matrix.goos != 'windows'
        with:
          name: homeway-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'windows'
        with:
          name: homeway-windows-zip
          path: dist/*.zip*
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homeway-linux-amd64
      - name: 冒烟（产物真能跑）
        run: |
          set -euo pipefail
          tar xzf homeway_*_linux_amd64.tar.gz
          # musl 静态是 linux 产物的发版口径（D7）：不挑发行版 libc，解压即跑
          file ./homeway | grep -q 'statically linked'
          ./homeway --version | grep -q '^homeway '
          ./homeway relay --version | grep -q '^homeway '
          ./homeway --help >/dev/null 2>&1 || true
          ./homeway serve --help >/dev/null 2>&1 || true
          ./homeway relay --help >/dev/null 2>&1 || true

  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
